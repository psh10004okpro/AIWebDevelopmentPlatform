---
# RAG Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-service
  namespace: nextgen-ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-service
  template:
    metadata:
      labels:
        app: rag-service
    spec:
      containers:
      - name: rag-service
        image: nextgen-ai-platform/rag-service:latest
        ports:
        - containerPort: 3005
        env:
        - name: PORT
          value: "3005"
        - name: QDRANT_URL
          valueFrom:
            configMapKeyRef:
              name: nextgen-ai-platform-config
              key: QDRANT_URL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: nextgen-ai-platform-secrets
              key: OPENAI_API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: rag-service
  namespace: nextgen-ai-platform
spec:
  selector:
    app: rag-service
  ports:
  - port: 3005
    targetPort: 3005
  type: ClusterIP

